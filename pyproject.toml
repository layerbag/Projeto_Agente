[project]
name = "llm-orchestration"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14.0"
dependencies = [
    "langchain (>=1.2.17,<2.0.0)",
    "langchain-core (>=1.3.3,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-groq (>=1.1.2,<2.0.0)",
    "langchain-google-genai (>=4.2.2,<5.0.0)",
    "langgraph (>=1.1.10,<2.0.0)",
    "sentence-transformers (>=5.4.1,<6.0.0)",
    "pypdf (>=6.10.2,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "youtube-transcript-api (>=1.2.4,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "yt-dlp (>=2026.3.17,<2027.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "pydantic (>=2.7.4,<3.0.0)",
    "python-multipart (>=0.0.27,<0.0.28)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "msgpack (>=1.0.4,<2.0.0)",
    "langchain-postgres (>=0.0.17,<0.0.18)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "llmlingua (>=0.2.2,<0.3.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
]

[tool.poetry]
packages = [
    {include = "api"},
    {include = "src"},
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "pyrefly (>=1.0.0,<2.0.0)"
]

ignore-missing-imports = [
    "langchain",
    "langchain_core",
]
